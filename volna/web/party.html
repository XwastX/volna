<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>Вечеринка · Volna</title>
<style>
:root{--bg:#070b18;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--tx:#eef1ff;--mut:#9aa3c7;--ac:#8fa8ff;--ac2:#c38bff;--good:#5fe3a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(120% 60% at 10% -10%,rgba(143,168,255,.25),transparent 60%),radial-gradient(90% 50% at 110% 0%,rgba(195,139,255,.22),transparent 60%),var(--bg);padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.2px;margin:4px 2px 14px}
.brand img{width:26px;height:26px;border-radius:7px}
.brand .g{margin-left:auto;font-weight:600;color:var(--mut);font-size:13px}
.now{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.now .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.4);opacity:.35;z-index:0}
.now>*:not(.bg){position:relative;z-index:1}
.art{width:72px;height:72px;border-radius:14px;background:#1a2040 center/cover;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.now .meta{min-width:0;flex:1}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);font-weight:700}
.t{font-weight:750;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:4px;transition:width .5s linear}
.skip{margin-top:10px;display:flex;gap:10px;align-items:center}
.btn{appearance:none;border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;color:#0a0f22;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.on{background:var(--good);color:#06231a}
.btn:disabled{opacity:.5}
.small{font-size:13px;color:var(--mut)}
.search{position:sticky;top:0;z-index:5;padding:12px 0 8px;background:linear-gradient(var(--bg) 70%,transparent)}
.search input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--tx);font:inherit;outline:none}
.search input:focus{border-color:var(--ac)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);margin:18px 4px 8px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px}
.row+.row{margin-top:2px}
.row:active{background:var(--card)}
.row .art{width:48px;height:48px;border-radius:10px}
.row .meta{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:650}
.row .a{font-size:13px}
.by{font-size:12px;color:var(--mut)}
.vote{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-weight:800;cursor:pointer}
.vote svg{width:18px;height:18px}
.vote.mine{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0f22;border-color:transparent}
.add{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0f22;font-size:24px;font-weight:700;cursor:pointer;flex:none}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:6px;cursor:pointer}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(95,227,161,.15);color:var(--good);margin-left:6px;vertical-align:2px}
.empty{color:var(--mut);text-align:center;padding:22px 10px;border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;background:#1c2346;border:1px solid var(--line);padding:12px 16px;border-radius:14px;transition:.25s;max-width:90vw;text-align:center;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.join{position:fixed;inset:0;z-index:30;background:rgba(7,11,24,.92);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
.join.on{display:flex}
.join .box{width:100%;max-width:380px;background:#11173a;border:1px solid var(--line);border-radius:22px;padding:22px}
.join h1{margin:0 0 6px;font-size:22px}
.join input{width:100%;margin:14px 0;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--tx);font:inherit}
.join .btn{width:100%;padding:14px}
.off{position:fixed;top:0;left:0;right:0;padding:10px;text-align:center;background:#5a2030;font-weight:700;display:none;z-index:40}
.off.on{display:block}
</style>
</head>
<body>
<div class="off" id="off">Нет связи с компьютером — проверь, что ты в той же Wi‑Fi</div>
<div class="wrap">
  <div class="brand"><img src="/favicon.ico" alt="">Volna · вечеринка<span class="g" id="guests"></span></div>
  <div class="now" id="now">
    <div class="bg" id="now-bg"></div>
    <div class="art" id="now-art"></div>
    <div class="meta">
      <div class="lbl">Сейчас играет</div>
      <div class="t" id="now-t">Тишина</div>
      <div class="a" id="now-a">Добавь первый трек</div>
      <div class="bar"><i id="now-bar"></i></div>
      <div class="skip" id="skip-box"><button class="btn ghost" id="skip">Пропустить</button><span class="small" id="skip-n"></span></div>
    </div>
  </div>
  <div class="search"><input id="q" placeholder="Найти трек и добавить в очередь" autocomplete="off" enterkeyhint="search"></div>
  <div id="results"></div>
  <h2>Очередь · по голосам</h2>
  <div id="queue"></div>
</div>
<div class="join" id="join"><div class="box">
  <h1>Привет! 👋</h1>
  <div class="small">Как тебя подписать в очереди? Имя увидят все на вечеринке.</div>
  <input id="name" maxlength="24" placeholder="Например, Влад" autocomplete="nickname">
  <button class="btn" id="go">Зайти</button>
</div></div>
<div class="toast" id="toast"></div>
<script>
const K = new URLSearchParams(location.search).get("k") || "";
const $ = s => document.querySelector(s);
const THUMB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>';
let st = null, lastPos = 0, lastAt = 0;
const ls = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function art(url) { const d = el("div", "art"); if (url && /^https:\/\//.test(url)) d.style.backgroundImage = `url("${url.replace(/"/g, "")}")`; return d; }
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 2600); }
async function api(path, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  const r = await fetch(`/api/${path}${path.includes("?") ? "&" : "?"}k=${encodeURIComponent(K)}`, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Ошибка");
  return d;
}
function fmt(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function render() {
  if (!st) return;
  const n = st.now || {};
  $("#now-t").textContent = n.title || "Тишина";
  $("#now-a").textContent = n.artist || "Добавь первый трек";
  const a = $("#now-art"); a.style.backgroundImage = n.art ? `url("${n.art.replace(/"/g, "")}")` : "";
  $("#now-bg").style.backgroundImage = a.style.backgroundImage;
  $("#guests").textContent = `${st.guests} ${st.guests % 10 === 1 && st.guests % 100 !== 11 ? "гость" : (st.guests % 10 >= 2 && st.guests % 10 <= 4 && (st.guests % 100 < 10 || st.guests % 100 >= 20)) ? "гостя" : "гостей"}`;
  const sk = st.skip; $("#skip-box").style.display = sk.on && n.title ? "" : "none";
  $("#skip").classList.toggle("on", sk.mine); $("#skip").textContent = sk.mine ? "Голос за пропуск ✓" : "Пропустить";
  $("#skip-n").textContent = `${sk.votes} из ${sk.need}`;
  const q = $("#queue"); q.replaceChildren();
  if (!st.queue.length) q.append(el("div", "empty", "Очередь пустая — найди трек сверху и добавь его"));
  for (const it of st.queue) {
    const r = el("div", "row"); r.append(art(it.art));
    const m = el("div", "meta"); m.append(el("div", "t", it.title), el("div", "a", it.artist), el("div", "by", `добавил(а) ${it.by}`)); r.append(m);
    if (it.own) { const x = el("button", "x", "×"); x.title = "Убрать"; x.onclick = () => act("remove", { qid: it.qid }); r.append(x); }
    const v = el("button", "vote" + (it.mine ? " mine" : "")); v.innerHTML = THUMB; v.append(el("span", "", String(it.votes)));
    v.onclick = () => act("vote", { qid: it.qid }); r.append(v); q.append(r);
  }
}
function bar() {
  const n = st && st.now; if (!n || !n.dur) { $("#now-bar").style.width = "0"; return; }
  const pos = lastPos + (n.playing ? Date.now() - lastAt : 0);
  $("#now-bar").style.width = `${Math.min(100, pos / n.dur * 100)}%`;
}
async function refresh() {
  try {
    st = await api("state"); lastPos = (st.now && st.now.pos) || 0; lastAt = Date.now();
    $("#off").classList.remove("on"); render(); bar();
    if (!st.me && !ls.get("vp-name")) $("#join").classList.add("on");
    else if (!st.me) api("join", { name: ls.get("vp-name") }).catch(() => {});
  } catch (e) { $("#off").classList.add("on"); }
}
async function act(path, body) { try { const r = await api(path, body); if (r.dup) toast("Этот трек уже в очереди — засчитали твой голос"); if (r.skipped) toast("Пропускаем!"); await refresh(); } catch (e) { toast(e.message); } }

let sTimer = 0, sReq = 0;
$("#q").addEventListener("input", () => { clearTimeout(sTimer); sTimer = setTimeout(search, 450); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(sTimer); search(); e.target.blur(); } });
async function search() {
  const q = $("#q").value.trim(), box = $("#results"), my = ++sReq;
  if (q.length < 2) { box.replaceChildren(); return; }
  box.replaceChildren(el("div", "small", "Ищу…"));
  try {
    const d = await api(`search?q=${encodeURIComponent(q)}`); if (my !== sReq) return;
    box.replaceChildren(el("h2", "", "Нашлось"));
    if (!d.rows.length) box.append(el("div", "empty", "Ничего не нашлось — попробуй по-другому"));
    for (const t of d.rows) {
      const r = el("div", "row"); r.append(art(t.art));
      const m = el("div", "meta"); const tt = el("div", "t", t.title); if (t.lib) tt.append(el("span", "tag", "У ХОЗЯИНА"));
      m.append(tt, el("div", "a", `${t.artist} · ${fmt(t.dur)}`)); r.append(m);
      const b = el("button", "add", "+"); b.title = "В очередь";
      b.onclick = async () => { b.disabled = true; await act("add", { token: t.token }); $("#q").value = ""; box.replaceChildren(); toast("Добавлено в очередь"); };
      r.append(b); box.append(r);
    }
  } catch (e) { if (my === sReq) box.replaceChildren(el("div", "empty", e.message)); }
}
$("#skip").onclick = () => act("skip", {});
$("#go").onclick = async () => {
  const n = $("#name").value.trim(); if (!n) { $("#name").focus(); return; }
  ls.set("vp-name", n);
  try { await api("join", { name: n }); $("#join").classList.remove("on"); refresh(); } catch (e) { toast(e.message); }
};
$("#name").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });
refresh(); setInterval(refresh, 2500); setInterval(bar, 500);
</script>
</body>
</html>
