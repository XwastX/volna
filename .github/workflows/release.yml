# Релиз Volna: когда в main меняется версия (volna/__init__.py и mobile/package.json), GitHub сам
# собирает установщик для Windows и APK для Android и выкладывает их в Releases с тегом vX.Y.Z.
# Установленные приложения находят новую версию и предлагают обновиться.
name: Release
on:
  push:
    branches: [main]
    paths: ["volna/__init__.py", "mobile/package.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Версии совпадают с тегом
        run: |
          PY=$(grep -oP '__version__ = "\K[^"]+' volna/__init__.py)
          JS=$(node -p "require('./mobile/package.json').version")
          echo "python=$PY mobile=$JS ref=$GITHUB_REF_NAME"
          [ "$PY" = "$JS" ] || { echo "Версии в volna/__init__.py и mobile/package.json различаются"; exit 1; }
          echo "version=$PY" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$PY" >/dev/null; then echo "Релиз v$PY уже есть — пропускаю"; echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Сборка Volna.exe
        run: >
          pyinstaller --noconfirm --clean --log-level ERROR --windowed --name Volna --icon volna\assets\icon.ico
          --add-data "volna\web;volna\web" --add-data "volna\assets;volna\assets"
          --collect-submodules winrt --hidden-import pypresence --collect-submodules qrcode
          --hidden-import sounddevice --collect-all _sounddevice_data --collect-all av main.py
      - name: Установщик
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ needs.check.outputs.version }}" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Volna-Setup-*.exe

  android:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/volna.jks"; echo "VOLNA_KEYSTORE=$RUNNER_TEMP/volna.jks" >> "$GITHUB_ENV";
          else echo "::warning::Нет секрета ANDROID_KEYSTORE — APK подписан временным ключом и не встанет поверх прошлой версии"; fi
      - name: Сборка APK
        working-directory: mobile
        env:
          VOLNA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          node scripts/prepare.mjs
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs
          cd android && chmod +x gradlew && ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Volna-${{ needs.check.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Volna-*.apk

  release:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Volna ${{ needs.check.outputs.version }}
          files: out/*
          generate_release_notes: true
